spring.application.name=aerocore-backend-api
server.port=${PORT:8080}
spring.threads.virtual.enabled=true
logging.level.aerocore=INFO

# Database (SQL Server). Empty = package / admin APIs are disabled and flight bookings stay in memory.
aerocore.db.url=${DB_URL:}
aerocore.db.user=${DB_USER:}
aerocore.db.password=${DB_PASSWORD:}

# Admin account. The admin API is disabled while the password is empty (no built-in default).
aerocore.admin.username=${ADMIN_USERNAME:admin}
aerocore.admin.password=${ADMIN_PASSWORD:}
aerocore.admin.token-secret=${ADMIN_TOKEN_SECRET:}

# API documents are served per API group (see OpenApiConfig).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
