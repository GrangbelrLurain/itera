# Profile "memory": in-memory data, no database. Local runs and end-to-end tests only.
# The admin account is fixed here so the stack starts without any secret; override through the environment.
aerocore.admin.username=${ADMIN_USERNAME:admin}
aerocore.admin.password=${ADMIN_PASSWORD:e2e-admin-password}
aerocore.admin.token-secret=${ADMIN_TOKEN_SECRET:e2e-token-secret}

# The unauthenticated reset endpoint (POST /api/test/reset) is off unless asked for: local runs and e2e set it to true.
aerocore.memory.reset-endpoint=${MEMORY_RESET_ENDPOINT:false}
# Reset the data to the sample state every interval (ISO-8601, e.g. PT6H). Blank = never. For public demos.
aerocore.memory.reset-interval=${MEMORY_RESET_INTERVAL:}
