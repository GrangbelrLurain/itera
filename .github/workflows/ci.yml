name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs more than read access, and no secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  web:
    name: Web, packages and boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated client matches the contract
        run: pnpm --filter @itera/api-client gen:check
      - run: pnpm --filter @itera/api-client check
      - name: Domain package
        run: pnpm --filter @itera/domain check && pnpm --filter @itera/domain test
      - run: pnpm --filter @itera/ui check
      - name: Module boundaries
        run: pnpm check:boundaries
      - name: Admin web
        run: pnpm --filter @itera/admin check && pnpm --filter @itera/admin test && pnpm --filter @itera/admin build

  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Unit, HTTP and contract tests
        working-directory: services/backend-api
        run: bash ./gradlew test

  gds-adapter:
    name: GDS adapter (simulated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - working-directory: services/gds-adapter
        run: |
          mkdir -p bin
          javac -d bin $(find src -name '*.java')
          java -cp bin aerocore.gds.GdsAdapterTest

  desktop-shell:
    name: Desktop shell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop-shell
      - working-directory: apps/desktop-shell
        run: cargo test --locked

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm install --frozen-lockfile
      - name: Build the stack under test (backend memory profile + admin web)
        run: |
          pnpm --filter @itera/admin build
          cd services/backend-api && bash ./gradlew bootJar -q
      - run: pnpm --filter @itera/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @itera/e2e test
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
